<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<meta
			name="description"
			content="Technical Lead, Vendor Integrations at Invent.us. Owns the Invent Store, its SDK, and third-party integrations. Full-stack React, TypeScript, Node.js and ASP.NET Core."
		/>
		<link rel="canonical" href="https://yonatanlurie.com/" />
		<link rel="icon" href="/src/assets/y.ico" />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://yonatanlurie.com/" />
		<meta property="og:title" content="Yonatan Lurie — Software Engineer" />
		<meta
			property="og:description"
			content="Full-stack engineer leading vendor integrations, the SDK, and third-party app review for a fintech platform app store."
		/>
		<meta name="twitter:card" content="summary" />

		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1117" media="(prefers-color-scheme: dark)" />

		<!-- Resolve the theme before first paint to avoid a light/dark flash -->
		<script>
			(function () {
				var theme;
				try {
					theme = localStorage.getItem("theme");
				} catch (e) {}
				if (theme !== "light" && theme !== "dark") {
					theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				}
				document.documentElement.dataset.theme = theme;
				// Opt in to scroll-reveal before first paint so content never flashes in
				if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
					document.documentElement.classList.add("reveal-ready");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
